name: "Rust Setup"
description: "Sets up rust for an environment"
inputs:
  machete:
    description: Include cargo-machete
    required: false
    default: "false"
  cross:
    description: Include cross
    required: false
    default: "false"
  cache-shared-key:
    description: Key for cache sharing
    required: false
    default: ""
  cache-policy:
    description: How caching should behave (pull-push, pull, disable)
    required: true
    default: pull-push

runs:
  using: "composite"
  steps:
    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        cache: ${{ inputs.cache-policy != 'disable' }}
        cache-save-if: ${{ inputs.cache-policy == 'pull-push' }}
        cache-shared-key: ${{ inputs.cache-shared-key }}
    - name: install cargo-binstall
      if: inputs.machete == 'true' || inputs.cross == 'true'
      shell: bash
      run: |
        if ! cargo binstall --version >/dev/null 2>&1; then
          curl -L --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
        fi
    - name: Install cargo machete
      if: inputs.machete == 'true'
      shell: bash
      run: |
        if ! cargo machete --version >/dev/null 2>&1; then
          cargo binstall --no-confirm --force cargo-machete
        fi
    - name: Install cross
      if: inputs.cross == 'true'
      shell: bash
      run: |
        if ! cross --version >/dev/null 2>&1; then
          cargo binstall --no-confirm --force cross
        fi

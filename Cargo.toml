[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
description = "A comprehensive release automation tool that streamlines the software release process across multiple programming languages and forge platforms"
homepage = "https://releasaurus.rgon.io"
repository = "https://github.com/robgonnella/releasaurus"
license = "MIT OR Apache-2.0"
keywords = ["changelog", "commits", "conventional", "release", "semver"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
color-eyre = "0.6.5"
indexmap = { version = "2.14.2", features = ["serde"] }
log = "0.4.35"
merge = "0.2.0"
secrecy = "0.10.3"
serde = "1.0.229"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
serde_regex = "1.2.0"
tokio = { version = "1.54.1", features = ["fs", "macros", "rt-multi-thread"] }
url = "2.5.8"

[package]
name = "releasaurus-core"
version = "1.1.0"
edition.workspace = true
description.workspace = true
readme = "README.md"
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
exclude = ["src/bin/gen_schema.rs"]

[package.metadata.cargo-machete]
ignored = ["serde_regex"]

[dependencies]
async-trait = "0.1.91"
base64 = "0.23.0"
chrono = "0.4.45"
color-eyre.workspace = true
derive_builder = "0.20.2"
futures-util = "0.3.33"
git-conventional = "1.1.0"
git2 = { version = "0.21.0", default-features = false, features = [
    "https",
    "vendored-libgit2",
    "vendored-openssl",
] }
gitlab = "0.1902.0"
graphql_client = "0.14.0"
indexmap.workspace = true
log.workspace = true
md5 = "0.8.1"
merge.workspace = true
next_version = "0.3.2"
octocrab = { version = "0.54.1", features = ["stream"] }
quick-xml = "0.41.0"
regex = "1.13.1"
reqwest = "0.13.4"
rustls = { version = "0.23", default-features = false }
schemars = { version = "1.2.2", features = ["indexmap2"] }
secrecy.workspace = true
semver = "1.0.28"
serde.workspace = true
serde_json.workspace = true
serde_regex.workspace = true
strum = { version = "0.28.0", features = ["derive"] }
tera = "1.20.1"
thiserror = "2.0.19"
tl = "0.7.8"
tokio.workspace = true
toml = "1.1.4"
toml_edit = "0.25.13"
url.workspace = true

[dev-dependencies]
mockall = "0.15.0"
temp-env = "0.3.6"
tempfile = "3.27.0"
test-log = "0.2.21"
wiremock = "0.6"

[features]
default = []
_integration_tests = []
